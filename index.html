<style>

    color: #eee;
    min-height: 100vh;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  /* --- Folder Screen --- */

    text-align: center;
    animation: fadeIn .5s ease;
    padding: 20px;
    width: 90%;
    max-width: 600px;
  }

    font-size: 2.2rem;
    margin-bottom: 8px;

  }
  #folder-screen p {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 32px;
  }
  .folder-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .folder-card {
    background: #16213e;
    border-radius: 16px;
    padding: 28px 24px;
    cursor: pointer;
    transition: all .25s ease;
    border: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    gap: 20px;
    text-align: left;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .folder-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(123,47,247,.3);
    border-color: rgba(123,47,247,.4);
  }
  .folder-card:active {
    transform: scale(.97);
  }
  .folder-icon {
    font-size: 2.8rem;
    flex-shrink: 0;
  }
  .folder-info {
    flex: 1;
  }
  .folder-name {
    font-size: 1.15rem;
    font-weight: 600;
    color: #eee;
    margin-bottom: 4px;
  }
  .folder-count {
    font-size: .9rem;
    color: #888;
  }

    display: none;
    text-align: center;
    animation: fadeIn .5s ease;
  }

    font-size: 2.4rem;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #start-screen p {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 36px;
    line-height: 1.8;
  }
  #start-btn {
    padding: 14px 56px;
    font-size: 1.2rem;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 24px rgba(123,47,247,.4);
  }
  #start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(123,47,247,.6); }
  #start-btn:active { transform: scale(.97); }
  .back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 24px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 20px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    transition: all .15s;
  }
  .back-btn:hover {
    border-color: #7b2ff7;
    color: #eee;
  }

    text-align: center;
    width: 90%;
    max-width: 760px;
    animation: fadeIn .4s ease;
  }

    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7);
    border-radius: 3px;
    transition: width .4s ease;
  }

    font-size: .9rem;
    color: #888;
    margin-bottom: 8px;
  }
  .jump-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .jump-section label {
    font-size: .85rem;
    color: #aaa;
  }
  .jump-input {
    width: 60px;
    padding: 6px 10px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 6px;
    background: #1a1a2e;
    color: #eee;
    text-align: center;
  }

    outline: none;
    border-color: #7b2ff7;
  }
  .jump-btn {
    padding: 6px 14px;
    font-size: .85rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s;

    transform: scale(1.05);
  }

    align-items: center;
    justify-content: center;

    font-weight: 700;

    font-size: 1.3rem;
    color: #ccc;
    margin-top: 4px;
  }

  .example-section {

    transform: translateY(12px);

  }

    font-size: .95rem;
    color: #999;

    font-size: .85rem;
    color: #666;
    height: 24px;

    background: #333;

  #folder-btn {

    margin-top: 16px;
    padding: 8px 24px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 20px;
    background: transparent;

</head>
<body>

<!-- Folder Screen -->
<div id="folder-screen">
  <h1>📚 词汇闪卡练习</h1>
  <p>请选择词组文件夹</p>
  <div class="folder-list">
    <div class="folder-card" onclick="selectFolder(0)">
      <div class="folder-icon">📁</div>
      <div class="folder-info">
        <div class="folder-name">YouTube 生字和词组</div>
        <div class="folder-count">31 个词组</div>
      </div>
    </div>
    <div class="folder-card" onclick="selectFolder(1)">
      <div class="folder-icon">📁</div>
      <div class="folder-info">
        <div class="folder-name">每日英语听力生词和词组</div>
        <div class="folder-count">26 个词组</div>
      </div>
    </div>
  </div>
</div>

<!-- Start Screen -->
<div id="start-screen">
  <h1 id="folder-title">📖 词汇闪卡练习</h1>
  <p>共 <span id="total-count">0</span> 个词组，随机出题<br>
     先试着说出意思，按 <kbd>空格</kbd> 看例句<br>
     再按 <kbd>空格</kbd> 进入下一个</p>
  <button id="start-btn" onclick="startQuiz()">开始练习</button>
  <br>
  <button class="back-btn" onclick="goToFolderScreen()">← 返回选择文件夹</button>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen">
  <button class="back-btn" onclick="goToFolderScreen()" style="margin-bottom:8px;">← 返回首页</button>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
  <div class="counter" id="counter"></div>
  <div class="jump-section">
    <label>跳转到：</label>
    <input type="number" class="jump-input" id="jump-input" min="1" placeholder="#">
    <button class="jump-btn" onclick="jumpToWord()">跳转</button>
  </div>
  <div class="word-card" id="word-card">
    <div class="word-text" id="word-text"></div>
    <div class="translation" id="translation"></div>
    <div class="example-section" id="example-section">
      <div class="example-en" id="example-en"></div>
      <div class="example-zh" id="example-zh"></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
</div>

<!-- End Screen -->
<div id="end-screen">
  <h2>🎉 全部完成！</h2>
  <p><span id="finished-count">0</span> 个词组已练习完毕</p>
  <button id="restart-btn" onclick="restartQuiz()">再来一轮</button>
  <br>
  <button id="folder-btn" onclick="goToFolderScreen()">← 返回首页选择文件夹</button>
</div>

var currentFolder = null;
var cards = [];
var queue = [];
var currentIndex = 0;
var state = 'show_word';
var total = 0;

// Folder selection
function selectFolder(idx) {
  currentFolder = idx;
  cards = folders[idx].cards;
  total = cards.length;
  
  // Update start screen
  document.getElementById('folder-title').textContent = '📖 ' + folders[idx].name;
  document.getElementById('total-count').textContent = total;
  document.getElementById('finished-count').textContent = total;
  
  // Switch to start screen
  document.getElementById('folder-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
}

function goToFolderScreen() {
  // Stop any ongoing speech
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('folder-screen').style.display = 'block';
}

// 语音朗读函数
function speakEnglish(text, speedArray, onComplete) {
  if (!('speechSynthesis' in window)) {
    console.log('浏览器不支持语音合成');
    if (onComplete) onComplete();
    return;
  }
  
  window.speechSynthesis.cancel();
  
  var cleanText = text.replace(/<[^>]*>/g, '');
  
  var totalTimes = speedArray.length;
  var spokenCount = 0;
  
  function speakOnce() {
    if (spokenCount >= totalTimes) {
      if (onComplete) onComplete();
      return;
    }
    
    var currentSpeed = speedArray[spokenCount];
    var utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'en-US';
    utterance.rate = currentSpeed;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    utterance.onend = function() {
      spokenCount++;
      console.log('朗读了第 ' + spokenCount + ' 遍，速度: ' + currentSpeed);
      if (spokenCount < totalTimes) {
        setTimeout(speakOnce, 600);
      } else {
        if (onComplete) onComplete();
      }
    };
    
    utterance.onerror = function(event) {
      console.error('朗读错误:', event);
      if (onComplete) onComplete();
    };
    
    window.speechSynthesis.speak(utterance);
  }
  
  speakOnce();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  queue = shuffle(cards);
  currentIndex = 0;
  state = 'show_word';
  displayWord();
}

function restartQuiz() {
  startQuiz();
}

function displayWord() {
  if (currentIndex >= total) {
    window.speechSynthesis.cancel();
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    return;
  }
  
  state = 'show_word';
  var card = queue[currentIndex];
  
  document.getElementById('word-text').textContent = card.word;
  document.getElementById('translation').textContent = card.translation;
  document.getElementById('example-en').innerHTML = card.exampleEn;
  document.getElementById('example-zh').textContent = card.exampleZh;
  document.getElementById('example-section').classList.remove('show');
  document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = ((currentIndex) / total * 100) + '%';
  updateHint();
  
  var wordCard = document.getElementById('word-card');
  wordCard.style.animation = 'none';
  wordCard.offsetHeight;
  wordCard.style.animation = 'fadeIn .35s ease';
}

function updateHint() {
  var hint = document.getElementById('hint');
  if (state === 'show_word') {
    hint.innerHTML = '🔊 按 <kbd>空格</kbd> 或点击屏幕朗读单词';
  } else if (state === 'read_word') {
    hint.innerHTML = '🔊 正在朗读...';
  } else if (state === 'show_example') {
    hint.innerHTML = '📖 按 <kbd>空格</kbd> 或点击屏幕朗读例句';
  } else if (state === 'read_example') {
    hint.innerHTML = '🔊 正在朗读例句...';
  }
}

function showExampleSection() {
  document.getElementById('example-section').classList.add('show');
  state = 'show_example';
  updateHint();
}

function goToNextWord() {
  currentIndex++;
  displayWord();
}

function jumpToWord() {
  var input = document.getElementById('jump-input');
  var num = parseInt(input.value);
  
  if (isNaN(num) || num < 1 || num > total) {
    alert('请输入 1 到 ' + total + ' 之间的数字');
    input.value = '';
    return;
  }
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  
  currentIndex = num - 1;
  state = 'show_word';
  displayWord();
  
  input.value = '';
}

document.addEventListener('DOMContentLoaded', function() {
  var jumpInput = document.getElementById('jump-input');
  if (jumpInput) {
    jumpInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToWord();
      }
    });
    
    jumpInput.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }
});

function handleUserAction() {
  var quizScreen = document.getElementById('quiz-screen');
  if (quizScreen.style.display !== 'block') {
    return;
  }
  
  console.log('用户操作，当前状态:', state);
  
  if (state === 'show_word') {
    state = 'read_word';
    updateHint();
    var word = queue[currentIndex].word;
    speakEnglish(word, [1.0, 1.0], function() {
      showExampleSection();
    });
    
  } else if (state === 'show_example') {
    state = 'read_example';
    updateHint();
    var exampleText = queue[currentIndex].exampleEn;
    speakEnglish(exampleText, [0.75, 1.0], function() {
      setTimeout(function() {
        goToNextWord();
      }, 800);
    });
    
  } else if (state === 'read_word' || state === 'read_example') {
    console.log('正在朗读，忽略操作');
  }
}

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    handleUserAction();
  }
});

document.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') {
    return;
  }
  // Don't trigger on folder cards, inputs, or other interactive elements
  if (e.target.closest('.folder-card') || e.target.closest('.jump-section') || e.target.closest('.back-btn') || e.target.closest('#folder-btn')) {
    return;
  }
  handleUserAction();
});

</script>
