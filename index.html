<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇闪卡练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  /* --- Folder Screen --- */
  #folder-screen {
    text-align: center;
    animation: fadeIn .5s ease;
    padding: 20px;
    width: 90%;
    max-width: 600px;
  }
  #folder-screen h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #folder-screen p {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 32px;
  }
  .folder-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .folder-card {
    background: #16213e;
    border-radius: 16px;
    padding: 28px 24px;
    cursor: pointer;
    transition: all .25s ease;
    border: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    gap: 20px;
    text-align: left;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .folder-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(123,47,247,.3);
    border-color: rgba(123,47,247,.4);
  }
  .folder-card:active {
    transform: scale(.97);
  }
  .folder-icon {
    font-size: 2.8rem;
    flex-shrink: 0;
  }
  .folder-info {
    flex: 1;
  }
  .folder-name {
    font-size: 1.15rem;
    font-weight: 600;
    color: #eee;
    margin-bottom: 4px;
  }
  .folder-count {
    font-size: .9rem;
    color: #888;
  }
  .upload-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: rgba(123,47,247,.2);
    font-size: 1.3rem;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(123,47,247,.3);
  }
  .upload-btn:hover {
    background: rgba(123,47,247,.4);
    border-color: rgba(123,47,247,.6);
    transform: scale(1.08);
  }
  .upload-btn:active {
    transform: scale(.95);
  }

  /* --- Start Screen --- */
  #start-screen {
    display: none;
    text-align: center;
    animation: fadeIn .5s ease;
  }
  #start-screen h1 {
    font-size: 2.4rem;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #start-screen p {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 36px;
    line-height: 1.8;
  }
  #start-btn {
    padding: 14px 56px;
    font-size: 1.2rem;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 24px rgba(123,47,247,.4);
  }
  #start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(123,47,247,.6); }
  #start-btn:active { transform: scale(.97); }
  .back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 24px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 20px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    transition: all .15s;
  }
  .back-btn:hover {
    border-color: #7b2ff7;
    color: #eee;
  }

  /* --- Quiz Screen --- */
  #quiz-screen {
    display: none;
    text-align: center;
    width: 90%;
    max-width: 760px;
    animation: fadeIn .4s ease;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7);
    border-radius: 3px;
    transition: width .4s ease;
  }

  .counter {
    font-size: .9rem;
    color: #888;
    margin-bottom: 8px;
  }
  .jump-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .jump-section label {
    font-size: .85rem;
    color: #aaa;
  }
  .jump-input {
    width: 60px;
    padding: 6px 10px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 6px;
    background: #1a1a2e;
    color: #eee;
    text-align: center;
  }
  .jump-input:focus {
    outline: none;
    border-color: #7b2ff7;
  }
  .jump-btn {
    padding: 6px 14px;
    font-size: .85rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s;
  }
  .jump-btn:hover {
    transform: scale(1.05);
  }
  .jump-btn:active {
    transform: scale(.95);
  }

  .word-card {
    background: #16213e;
    border-radius: 18px;
    padding: 48px 32px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all .3s ease;
  }

  .word-text {
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .translation {
    font-size: 1.3rem;
    color: #ccc;
    margin-top: 4px;
  }

  .example-section {
    margin-top: 20px;
    opacity: 0;
    transform: translateY(12px);
    transition: all .4s ease;
    max-height: 0;
    overflow: hidden;
  }
  .example-section.show {
    opacity: 1;
    transform: translateY(0);
    max-height: 400px;
  }

  .example-en {
    font-size: 1.05rem;
    color: #b0c4de;
    line-height: 1.7;
    margin-bottom: 10px;
    padding: 14px 20px;
    background: rgba(255,255,255,.04);
    border-radius: 10px;
    border-left: 3px solid #7b2ff7;
  }
  .example-en em {
    color: #00d2ff;
    font-style: normal;
    font-weight: 600;
  }

  .example-zh {
    font-size: .95rem;
    color: #999;
    line-height: 1.6;
  }

  .hint {
    margin-top: 24px;
    font-size: .85rem;
    color: #666;
    height: 24px;
  }
  .hint kbd {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    background: #333;
    border: 1px solid #555;
    font-family: monospace;
    color: #ccc;
    font-size: .85rem;
  }

  .nav-arrows {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    margin-top: 20px;
  }
  .nav-arrow {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: #16213e;
    color: #aaa;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #333;
  }
  .nav-arrow:hover {
    background: #1a2744;
    color: #00d2ff;
    border-color: #00d2ff;
    transform: scale(1.1);
  }
  .nav-arrow:active {
    transform: scale(.95);
  }
  .nav-arrow:disabled {
    opacity: .3;
    cursor: not-allowed;
    transform: none;
  }
  .nav-arrow:disabled:hover {
    background: #16213e;
    color: #aaa;
    border-color: #333;
  }

  /* --- End Screen --- */
  #end-screen {
    display: none;
    text-align: center;
    animation: fadeIn .5s ease;
  }
  #end-screen h2 {
    font-size: 2rem;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #end-screen p { color: #aaa; margin-bottom: 28px; font-size: 1.05rem; }
  #restart-btn {
    padding: 12px 48px;
    font-size: 1.1rem;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s;
  }
  #restart-btn:hover { transform: scale(1.05); }
  #folder-btn {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 24px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 20px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    transition: all .15s;
  }
  #folder-btn:hover {
    border-color: #7b2ff7;
    color: #eee;
  }

  /* --- Settings Panel --- */
  .settings-icon-btn {
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    vertical-align: middle;
    opacity: .6;
    transition: opacity .2s;
  }
  .settings-icon-btn:hover { opacity: 1; }
  #settings-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .settings-panel {
    background: #16213e;
    border-radius: 16px;
    padding: 32px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  .settings-panel h3 {
    font-size: 1.3rem;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .settings-section {
    text-align: left;
    margin-bottom: 20px;
  }
  .settings-section label {
    display: block;
    font-size: .9rem;
    color: #aaa;
    margin-bottom: 8px;
  }
  .settings-input {
    width: 100%;
    padding: 10px 14px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 8px;
    background: #1a1a2e;
    color: #eee;
    margin-bottom: 12px;
  }
  .settings-input:focus {
    outline: none;
    border-color: #7b2ff7;
  }
  .sync-btn {
    width: 100%;
    padding: 10px;
    font-size: .95rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #00d2ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform .15s;
  }
  .sync-btn:hover { transform: scale(1.02); }
  .sync-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .reset-btn {
    width: 100%;
    padding: 10px;
    font-size: .9rem;
    border: 1px solid #e74c3c;
    border-radius: 10px;
    background: rgba(231,76,60,.1);
    color: #e74c3c;
    cursor: pointer;
    transition: all .15s;
    margin-top: 8px;
  }
  .reset-btn:hover { background: rgba(231,76,60,.25); }
  .delete-card-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(231,76,60,.15);
    color: #e74c3c;
    font-size: 1.3rem;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(231,76,60,.3);
  }
  .delete-card-btn:hover {
    background: rgba(231,76,60,.35);
    border-color: #e74c3c;
    transform: scale(1.1);
  }
  .delete-card-btn:active { transform: scale(.9); }
  .settings-hint {
    font-size: .8rem;
    color: #666;
    margin-top: 10px;
    line-height: 1.5;
  }
  .settings-close-btn {
    padding: 8px 24px;
    font-size: .9rem;
    border: 1px solid #444;
    border-radius: 20px;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    transition: all .15s;
  }
  .settings-close-btn:hover {
    border-color: #7b2ff7;
    color: #eee;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- Folder Screen -->
<div id="folder-screen">
  <h1>📚 词汇闪卡练习</h1>
  <p>请选择词组文件夹 <button class="settings-icon-btn" onclick="openSettings()" title="设置">⚙️</button></p>
  <div class="folder-list">
    <div class="folder-card" onclick="selectFolder(0)">
      <div class="folder-icon">📁</div>
      <div class="folder-info">
        <div class="folder-name">YouTube 生字和词组</div>
        <div class="folder-count" id="folder-count-0">31 个词组</div>
      </div>
      <button class="upload-btn" onclick="event.stopPropagation(); triggerUpload(0);" title="上传Excel补充词组">📤</button>
    </div>
    <div class="folder-card" onclick="selectFolder(1)">
      <div class="folder-icon">📁</div>
      <div class="folder-info">
        <div class="folder-name">每日英语听力生词和词组</div>
        <div class="folder-count" id="folder-count-1">26 个词组</div>
      </div>
      <button class="upload-btn" onclick="event.stopPropagation(); triggerUpload(1);" title="上传Excel补充词组">📤</button>
    </div>
  </div>
  <input type="file" id="upload-input" accept=".xlsx,.xls" style="display:none" onchange="handleUpload(event)">
</div>

<!-- Start Screen -->
<div id="start-screen">
  <h1 id="folder-title">📖 词汇闪卡练习</h1>
  <p>共 <span id="total-count">0</span> 个词组，随机出题<br>
     先试着说出意思，按 <kbd>空格</kbd> 看例句<br>
     再按 <kbd>空格</kbd> 进入下一个</p>
  <button id="start-btn" onclick="startQuiz()">开始练习</button>
  <br>
  <button class="back-btn" onclick="goToFolderScreen()">← 返回选择文件夹</button>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen">
  <button class="back-btn" onclick="goToFolderScreen()" style="margin-bottom:8px;">← 返回首页</button>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
  <div class="counter" id="counter"></div>
  <div class="jump-section">
    <label>跳转到：</label>
    <input type="number" class="jump-input" id="jump-input" min="1" placeholder="#">
    <button class="jump-btn" onclick="jumpToWord()">跳转</button>
  </div>
  <div class="word-card" id="word-card">
    <div class="word-text" id="word-text"></div>
    <div class="translation" id="translation"></div>
    <div class="example-section" id="example-section">
      <div class="example-en" id="example-en"></div>
      <div class="example-zh" id="example-zh"></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="nav-arrows">
    <button class="nav-arrow" id="prev-btn" onclick="goBack()" title="上一个">◀</button>
    <button class="delete-card-btn" onclick="deleteCurrentCard()" title="删除此卡片">🗑️</button>
    <button class="nav-arrow" id="next-btn" onclick="skipForward()" title="下一个">▶</button>
  </div>
</div>

<!-- End Screen -->
<div id="end-screen">
  <h2>🎉 全部完成！</h2>
  <p><span id="finished-count">0</span> 个词组已练习完毕</p>
  <button id="restart-btn" onclick="restartQuiz()">再来一轮</button>
  <br>
  <button id="folder-btn" onclick="goToFolderScreen()">← 返回首页选择文件夹</button>
</div>

<script>
// Dynamically load SheetJS so it doesn't block page rendering
(function() {
  var s = document.createElement('script');
  s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
  s.async = true;
  document.head.appendChild(s);
})();

// __FOLDERS_DATA_START__
var folders = [
  {
    "name": "YouTube 生字和词组",
    "cards": [
      {
        "word": "record-setting",
        "translation": "创纪录的",
        "exampleEn": "Analysis of the Pascal A nuclear test and its <em>record-setting</em> steel plate.",
        "exampleZh": "帕斯卡A核试验及其创纪录的钢板分析。"
      },
      {
        "word": "catastrophically",
        "translation": "灾难性地",
        "exampleEn": "The 1956 Pascal A nuclear test failed <em>catastrophically</em> due to a yield calculation error.",
        "exampleZh": "1956年帕斯卡A核试验因当量计算错误而灾难性地失败了。"
      },
      {
        "word": "yield calculation error",
        "translation": "当量计算错误",
        "exampleEn": "…failed catastrophically due to a <em>yield calculation error</em>.",
        "exampleZh": "……因当量计算错误而灾难性地失败了。"
      },
      {
        "word": "interstellar space",
        "translation": "星际空间",
        "exampleEn": "The plate could theoretically travel into <em>interstellar space</em>.",
        "exampleZh": "该钢板理论上可以飞入星际空间。"
      },
      {
        "word": "Test Setup & Objective",
        "translation": "试验设置与目标",
        "exampleEn": "<em>Test Setup & Objective</em>: The scientists dug a 150m deep, 1.2m diameter test shaft.",
        "exampleZh": "试验设置与目标：科学家挖掘了一口150米深、直径1.2米的试验井。"
      },
      {
        "word": "Projectile",
        "translation": "抛射物；发射物",
        "exampleEn": "The High-Speed <em>Projectile</em> — referring to the 900kg steel plate cover.",
        "exampleZh": "高速抛射物——指的是900公斤的钢板盖。"
      },
      {
        "word": "Planned yield",
        "translation": "计划当量",
        "exampleEn": "<em>Planned yield</em> was equivalent to 6kg of TNT.",
        "exampleZh": "计划当量相当于6公斤TNT。"
      },
      {
        "word": "threshold",
        "translation": "阈值；临界值",
        "exampleEn": "The plate's speed far exceeded this <em>threshold</em>.",
        "exampleZh": "钢板的速度远远超过了这个阈值（太阳系逃逸速度16.7km/s）。"
      },
      {
        "word": "intercontinental missiles",
        "translation": "洲际导弹",
        "exampleEn": "Faster than rockets or <em>intercontinental missiles</em>.",
        "exampleZh": "比火箭或洲际导弹还要快。"
      },
      {
        "word": "Record-setting speed, >194 Mach",
        "translation": "创纪录的速度，超过194马赫",
        "exampleEn": "Significance: <em>Record-setting speed, >194 Mach</em>.",
        "exampleZh": "意义：创纪录的速度，超过194马赫。"
      },
      {
        "word": "macroscopic object",
        "translation": "宏观物体",
        "exampleEn": "The fastest man-made <em>macroscopic object</em> in recorded human history.",
        "exampleZh": "人类有记录以来最快的自制宏观物体。"
      },
      {
        "word": "trigger a controlled",
        "translation": "引发一次可控的…",
        "exampleEn": "Planned to <em>trigger a controlled</em> underground nuclear explosion.",
        "exampleZh": "计划引发一次可控的地下核爆炸。"
      },
      {
        "word": "pre-set planned yield",
        "translation": "预先设定的计划当量",
        "exampleEn": "50,000 times the <em>pre-set planned yield</em> for the test.",
        "exampleZh": "是试验预先设定的计划当量的5万倍。"
      },
      {
        "word": "Shaft Transformation",
        "translation": "竖井蜕变/转化",
        "exampleEn": "<em>Shaft Transformation</em>: The massive energy instantly vaporized internal concrete structures.",
        "exampleZh": "竖井蜕变：巨大的能量瞬间汽化了内部混凝土结构，把试验井变成了巨型发射炮筒。"
      },
      {
        "word": "ejected",
        "translation": "被弹射出的",
        "exampleEn": "The high-speed camera only captured the <em>ejected</em> steel cover in a single frame.",
        "exampleZh": "高速相机仅在一帧画面中捕捉到了被弹射出的钢盖。"
      },
      {
        "word": "footage",
        "translation": "影像；录像片段",
        "exampleEn": "No continuous tracking <em>footage</em> available for reference.",
        "exampleZh": "没有连续的跟踪影像可供参考。"
      },
      {
        "word": "opening hook",
        "translation": "开场钩子；开场引子",
        "exampleEn": "It serves as the <em>opening hook</em> that frames the core topic of the entire sharing session.",
        "exampleZh": "它充当了整个分享会的开场钩子，引出了核心话题。"
      },
      {
        "word": "the core empirical data",

var currentFolder = null;

// Folder selection
function selectFolder(idx) {
  currentFolder = idx;
  cards = folders[idx].cards;
  total = cards.length;
  
  // Update start screen
  document.getElementById('folder-title').textContent = '📖 ' + folders[idx].name;
  document.getElementById('total-count').textContent = total;
  document.getElementById('finished-count').textContent = total;
  
  // Switch to start screen
  document.getElementById('folder-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
}

function goToFolderScreen() {
  // Stop any ongoing speech
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('folder-screen').style.display = 'block';
  // Refresh folder counts when returning to folder screen
  updateFolderCounts();
}

}

function handleUpload(event) {
  var file = event.target.files[0];
  if (!file) return;

  var folderIdx = pendingUploadFolder;
  if (folderIdx === null) return;

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var workbook = XLSX.read(data, { type: 'array' });
      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

      if (rows.length < 2) {
        alert('Excel 文件为空或格式不正确，请至少包含一行数据。');
        return;
      }

      // Try to identify columns from header row (check longer patterns first!)
      // Handles duplicate headers: first "中文翻译" = word translation, second = example Chinese
      var header = rows[0];
      var colMap = { word: -1, translation: -1, exampleEn: -1, exampleZh: -1 };

      for (var i = 0; i < header.length; i++) {
        var h = String(header[i]).toLowerCase().trim();
        if (h === 'word' || h === '英文' || h === '单词' || h === '词组') {
          colMap.word = i;
        } else if (h === '英文例句' || h === '例句' || h === 'exampleen' || h === 'example') {
          if (colMap.exampleEn === -1) colMap.exampleEn = i;
        } else if (h === '中文翻译' || h === '中文释义') {
          // Could be word translation or example Chinese - disambiguate by checking previous column
          if (colMap.exampleEn !== -1) {
            // English example already found → this is the Chinese example translation
            colMap.exampleZh = i;
          } else if (colMap.exampleZh !== -1) {
            // Already have exampleZh → this must be word translation
            colMap.translation = i;
          } else {
            // No example yet → assume this is word translation
            colMap.translation = i;
          }
        } else if (h === '中文例句' || h === 'examplezh') {
          colMap.exampleZh = i;
        } else if (h === 'translation' || h === '中文' || h === '翻译') {
          colMap.translation = i;
        }
      }

      // Fallback: if header not recognized, try to detect by position
      if (colMap.word === -1) {
        colMap.word = 0;
        colMap.translation = (header.length >= 2) ? 1 : -1;
        colMap.exampleEn = (header.length >= 3) ? 2 : -1;
        colMap.exampleZh = (header.length >= 4) ? 3 : -1;
      }

      var added = 0;
      for (var r = 1; r < rows.length; r++) {
        var row = rows[r];
        var word = row[colMap.word];
        if (!word || String(word).trim() === '') continue;

        var exampleEn = row[colMap.exampleEn];
        var exampleZh = row[colMap.exampleZh];

        // If exampleEn contains em tags, keep as-is; otherwise wrap keyword in em
        var exampleHtml = exampleEn ? String(exampleEn) : '';
        if (exampleHtml && exampleHtml.indexOf('<em>') === -1) {
          var wordStr = String(word).trim();
          var regex = new RegExp(wordStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
          exampleHtml = exampleHtml.replace(regex, '<em>' + wordStr + '</em>');
        }

        folders[folderIdx].cards.push({
          word: String(word).trim(),
          translation: row[colMap.translation] ? String(row[colMap.translation]).trim() : '',
          exampleEn: exampleHtml,
          exampleZh: exampleZh ? String(exampleZh).trim() : ''
        });
        added++;
      }

      if (added > 0) {
        updateFolderCounts();
        saveToStorage();
        alert('✅ 成功添加 ' + added + ' 个词组到「' + folders[folderIdx].name + '」！');
      } else {
        alert('⚠️ 未找到有效词组数据，请检查 Excel 格式。');
      }
    } catch (err) {
      alert('解析文件失败：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function updateFolderCounts() {
  for (var i = 0; i < folders.length; i++) {
    var el = document.getElementById('folder-count-' + i);
    if (el) {
      el.textContent = folders[i].cards.length + ' 个词组';
    }
  }
}

// ---- LocalStorage Persistence ----
function saveToStorage() {
  try {
    var saveData = folders.map(function(f) { return { name: f.name, cards: f.cards }; });
    localStorage.setItem('flashcard_folders', JSON.stringify(saveData));
  } catch(e) {
    console.error('Save to localStorage failed:', e);
  }
}

function loadFromStorage() {
  try {
    var saved = localStorage.getItem('flashcard_folders');
    if (saved) {
      var data = JSON.parse(saved);
      if (data && data.length === folders.length) {
        var totalAdded = 0;
        for (var i = 0; i < data.length; i++) {
          if (data[i].cards && data[i].cards.length > folders[i].cards.length) {
            folders[i].cards = data[i].cards;
            totalAdded += data[i].cards.length - folders[i].cards.length;
          }
        }
        updateFolderCounts();
        if (totalAdded > 0) {
          console.log('从本地存储恢复了 ' + totalAdded + ' 个词组');
        }
      }
    }
  } catch(e) {
    console.error('Load from localStorage failed:', e);
  }
}

function saveOriginalState() {
  try {
    if (!localStorage.getItem('flashcard_original')) {
      var orig = folders.map(function(f) { return { name: f.name, cards: f.cards.map(function(c) { return { word: c.word, translation: c.translation, exampleEn: c.exampleEn, exampleZh: c.exampleZh }; }) }; });
      localStorage.setItem('flashcard_original', JSON.stringify(orig));
    }
  } catch(e) { console.error('Save original state failed:', e); }
}

function deleteCurrentCard() {
  if (cards.length === 0) return;
  var card = queue[currentIndex];
  if (!confirm('确定删除「' + card.word + '」吗？')) return;
  
  // Remove from the folder's cards array
  var folderCards = folders[currentFolder].cards;
  for (var i = 0; i < folderCards.length; i++) {
    if (folderCards[i].word === card.word && folderCards[i].translation === card.translation) {
      folderCards.splice(i, 1);
      break;
    }
  }
  
  // Remove from queue
  queue.splice(currentIndex, 1);
  total = queue.length;
  
  if (total === 0) {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    document.getElementById('finished-count').textContent = '0';
  } else if (currentIndex >= total) {
    currentIndex = total - 1;
    displayWord();
  } else {
    displayWord();
  }
  
  saveToStorage();
  updateFolderCounts();
}

function resetFolder(idx) {
  if (!confirm('确定要重置「' + folders[idx].name + '」吗？\n所有上传添加的词组将被删除，此操作不可撤销。')) return;
  
  try {
    var orig = JSON.parse(localStorage.getItem('flashcard_original'));
    if (orig && orig[idx]) {
      folders[idx].cards = orig[idx].cards.map(function(c) {
        return { word: c.word, translation: c.translation, exampleEn: c.exampleEn, exampleZh: c.exampleZh };
      });
      saveToStorage();
      updateFolderCounts();
      alert('✅「' + folders[idx].name + '」已重置，恢复到 ' + folders[idx].cards.length + ' 个词组');
    } else {
      alert('未找到原始数据，无法重置');
    }
  } catch(e) {
    alert('重置失败: ' + e.message);
  }
}

// ---- GitHub Sync ----
function openSettings() {
  document.getElementById('settings-overlay').style.display = 'flex';
  var savedPat = localStorage.getItem('flashcard_github_pat') || '';
  document.getElementById('github-pat-input').value = savedPat;
}

function closeSettings() {
  document.getElementById('settings-overlay').style.display = 'none';
}

function syncToGitHub() {
  var pat = document.getElementById('github-pat-input').value.trim();
  if (!pat) {
    alert('请输入 GitHub Personal Access Token');
    return;
  }

  localStorage.setItem('flashcard_github_pat', pat);
  var btn = document.getElementById('sync-btn');
  btn.textContent = '同步中...';
  btn.disabled = true;

  // Step 1: Get current file SHA from GitHub
  fetch('https://api.github.com/repos/NHA6810/vocab-flashcard/contents/index.html', {
    headers: { 'Authorization': 'token ' + pat }
  })
  .then(function(r) { return r.json(); })
  .then(function(fileData) {
    if (!fileData.sha) {
      throw new Error('无法读取 GitHub 文件: ' + (fileData.message || '未知错误'));
    }
    var sha = fileData.sha;

    // Step 2: Fetch current file content
    return fetch('https://raw.githubusercontent.com/NHA6810/vocab-flashcard/main/index.html?t=' + Date.now())
      .then(function(r) { return r.text(); })
      .then(function(html) {
        return { sha: sha, html: html };
      });
  })
  .then(function(result) {
    var sha = result.sha;
    var html = result.html;

    // Step 3: Replace folders data in HTML
    var foldersJSON = JSON.stringify(folders, null, 2);
    var newHTML = html.replace(
      /\/\/\s*__FOLDERS_DATA_START__\s*[\s\S]*?\/\/\s*__FOLDERS_DATA_END__/,
      '// __FOLDERS_DATA_START__\nvar folders = ' + foldersJSON + ';\n// __FOLDERS_DATA_END__'
    );

    // Step 4: Encode and push to GitHub
    var encoded = btoa(unescape(encodeURIComponent(newHTML)));

    return fetch('https://api.github.com/repos/NHA6810/vocab-flashcard/contents/index.html', {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + pat,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Sync flashcard data via browser upload',
        content: encoded,
        sha: sha
      })
    });
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    btn.textContent = '✅ 同步成功';
    btn.disabled = false;
    setTimeout(function() { btn.textContent = '🔄 同步到 GitHub'; }, 3000);
    if (!result.sha && result.message) {
      alert('同步失败: ' + result.message);
    }
  })
  .catch(function(err) {
    btn.textContent = '🔄 同步到 GitHub';
    btn.disabled = false;
    alert('同步失败: ' + err.message);
  });
}

// Load from storage on page load
document.addEventListener('DOMContentLoaded', function() {
  saveOriginalState();
  loadFromStorage();
});

// 语音朗读函数
function speakEnglish(text, speedArray, onComplete) {
  if (!('speechSynthesis' in window)) {
    console.log('浏览器不支持语音合成');
    if (onComplete) onComplete();
    return;
  }
  
  window.speechSynthesis.cancel();
  
  var cleanText = text.replace(/<[^>]*>/g, '');
  
  var totalTimes = speedArray.length;
  var spokenCount = 0;
  
  function speakOnce() {
    if (spokenCount >= totalTimes) {
      if (onComplete) onComplete();
      return;
    }
    
    var currentSpeed = speedArray[spokenCount];
    var utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'en-US';
    utterance.rate = currentSpeed;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    utterance.onend = function() {
      spokenCount++;
      console.log('朗读了第 ' + spokenCount + ' 遍，速度: ' + currentSpeed);
      if (spokenCount < totalTimes) {
        setTimeout(speakOnce, 600);
      } else {
        if (onComplete) onComplete();
      }
    };
    
    utterance.onerror = function(event) {
      console.error('朗读错误:', event);
      if (onComplete) onComplete();
    };
    
    window.speechSynthesis.speak(utterance);
  }
  
  speakOnce();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function startQuiz() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  queue = shuffle(cards);
  currentIndex = 0;
  state = 'show_word';
  displayWord();
}

function restartQuiz() {
  startQuiz();
}

function displayWord() {
  if (currentIndex >= total) {
    window.speechSynthesis.cancel();
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    return;
  }
  
  state = 'show_word';
  var card = queue[currentIndex];
  
  document.getElementById('word-text').textContent = card.word;
  document.getElementById('translation').textContent = card.translation;
  document.getElementById('example-en').innerHTML = card.exampleEn;
  document.getElementById('example-zh').textContent = card.exampleZh;
  document.getElementById('example-section').classList.remove('show');
  document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + total;
  document.getElementById('progress-fill').style.width = ((currentIndex) / total * 100) + '%';
  updateHint();
  
  var wordCard = document.getElementById('word-card');
  wordCard.style.animation = 'none';
  wordCard.offsetHeight;
  wordCard.style.animation = 'fadeIn .35s ease';
  
  // 更新前进后退按钮状态
  var prevBtn = document.getElementById('prev-btn');
  var nextBtn = document.getElementById('next-btn');
  if (prevBtn) prevBtn.disabled = (currentIndex === 0);
  if (nextBtn) nextBtn.disabled = (currentIndex >= total - 1);
}

function updateHint() {
  var hint = document.getElementById('hint');
  if (state === 'show_word') {
    hint.innerHTML = '🔊 按 <kbd>空格</kbd> 或点击屏幕朗读单词';
  } else if (state === 'read_word') {
    hint.innerHTML = '🔊 正在朗读...';
  } else if (state === 'show_example') {
    hint.innerHTML = '📖 按 <kbd>空格</kbd> 或点击屏幕朗读例句';
  } else if (state === 'read_example') {
    hint.innerHTML = '🔊 正在朗读例句...';
  }
}

function showExampleSection() {
  document.getElementById('example-section').classList.add('show');
  state = 'show_example';
  updateHint();
}

function goToNextWord() {
  currentIndex++;
  displayWord();
}

// 后退到上一个单词
function goBack() {
  if (currentIndex > 0) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentIndex--;
    displayWord();
  }
}

// 前进到下一个单词（跳过当前）
function skipForward() {
  if (currentIndex < total - 1) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentIndex++;
    displayWord();
  }
}

function jumpToWord() {
  var input = document.getElementById('jump-input');
  var num = parseInt(input.value);
  
  if (isNaN(num) || num < 1 || num > total) {
    alert('请输入 1 到 ' + total + ' 之间的数字');
    input.value = '';
    return;
  }
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  
  currentIndex = num - 1;
  state = 'show_word';
  displayWord();
  
  input.value = '';
}

document.addEventListener('DOMContentLoaded', function() {
  var jumpInput = document.getElementById('jump-input');
  if (jumpInput) {
    jumpInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToWord();
      }
    });
    
    jumpInput.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }
});

function handleUserAction() {
  var quizScreen = document.getElementById('quiz-screen');
  if (quizScreen.style.display !== 'block') {
    return;
  }
  
  console.log('用户操作，当前状态:', state);
  
  if (state === 'show_word') {
    state = 'read_word';
    updateHint();
    var word = queue[currentIndex].word;
    speakEnglish(word, [1.0, 1.0], function() {
      showExampleSection();
    });
    
  } else if (state === 'show_example') {
    state = 'read_example';
    updateHint();
    var exampleText = queue[currentIndex].exampleEn;
    speakEnglish(exampleText, [0.75, 1.0], function() {
      setTimeout(function() {
        goToNextWord();
      }, 800);
    });
    
  } else if (state === 'read_word' || state === 'read_example') {
    console.log('正在朗读，忽略操作');
  }
}

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    handleUserAction();
  }
});

document.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') {
    return;
  }
  // Don't trigger on folder cards, inputs, or other interactive elements
  if (e.target.closest('.folder-card') || e.target.closest('.jump-section') || e.target.closest('.back-btn') || e.target.closest('#folder-btn') || e.target.closest('.nav-arrow') || e.target.closest('.upload-btn') || e.target.closest('.settings-icon-btn') || e.target.closest('#settings-overlay') || e.target.closest('.delete-card-btn')) {
    return;
  }
  handleUserAction();
});

</script>
